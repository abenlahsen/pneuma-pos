services:
  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT:-8888}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./back:/var/www
    depends_on:
      - php
      - angular
    networks:
      - pneuma-net

  php:
    build:
      context: ./back
      dockerfile: Dockerfile
    volumes:
      - ./back:/var/www
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - pneuma-net

  mysql:
    image: mysql:8.0
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pneuma_pos}
      MYSQL_USER: ${MYSQL_USER:-pneuma}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pneuma-net

  angular:
    build:
      context: ./front
      dockerfile: Dockerfile
    ports:
      - "${ANGULAR_PORT:-4200}:4200"
    volumes:
      - ./front:/app
      - front-node-modules:/app/node_modules
    networks:
      - pneuma-net

  php-e2e:
    build:
      context: ./back
      dockerfile: Dockerfile
    volumes:
      - ./back:/var/www
    environment:
      - DB_DATABASE=pneuma_pos_test
      - ADMIN_INITIAL_PASSWORD=${E2E_ADMIN_PASSWORD:-}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - pneuma-net
    profiles:
      - e2e

  nginx-e2e:
    image: nginx:alpine
    ports:
      - "${NGINX_E2E_PORT:-8889}:80"
    volumes:
      - ./docker/nginx/e2e.conf:/etc/nginx/conf.d/default.conf
      - ./back:/var/www
    depends_on:
      php-e2e:
        condition: service_healthy
      angular:
        condition: service_started
    networks:
      - pneuma-net
    profiles:
      - e2e

  playwright:
    build:
      context: ./e2e
      dockerfile: Dockerfile
    volumes:
      - ./e2e:/e2e
      - e2e-node-modules:/e2e/node_modules
    environment:
      - E2E_BASE_URL=http://nginx-e2e:80
      - E2E_ADMIN_EMAIL=${E2E_ADMIN_EMAIL:-admin@pneuma.pos}
      - E2E_ADMIN_PASSWORD=${E2E_ADMIN_PASSWORD:-}
    depends_on:
      - nginx-e2e
    networks:
      - pneuma-net
    profiles:
      - e2e

volumes:
  mysql-data:
  front-node-modules:
  e2e-node-modules:

networks:
  pneuma-net:
    driver: bridge
