<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/modernist-c14075a3-7e47-498e-a6ce-5ff80a0266f8/styles.css">
<style>
  .rl { display: flex; flex-direction: column; align-items: center; background: var(--color-neutral-900); height: 100%; }
  .rl-b { height: 56px; width: 100%; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid var(--color-neutral-700); }
  .rl-b span { font-size: 15px; font-weight: 800; color: var(--ac, #ec3013); letter-spacing: -0.02em; }
  .rl-s { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0; width: 100%; flex: 1; }
  .rl-i { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: var(--color-neutral-500); cursor: pointer; border-radius: 8px; transition: background .12s, color .12s; }
  .rl-i:hover { background: var(--color-neutral-800); color: var(--color-neutral-100); }
  .rl-i[data-open='true'] { background: var(--color-neutral-800); color: var(--color-neutral-100); }
  .rl-i[data-active='true'] { background: var(--ac, #ec3013); color: #fff; }
  .rl-d { width: 32px; height: 1px; background: var(--color-neutral-600); margin: 8px 0; }
  .rl-u { margin-top: auto; width: 100%; height: 56px; display: flex; align-items: center; justify-content: center; border-top: 1px solid var(--color-neutral-700); }
  .rl-u span { width: 30px; height: 30px; border-radius: 8px; background: var(--ac, #ec3013); color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
</style>
</helmet>

<div class="rl">
  <div class="rl-b"><span>PM</span></div>

  <sc-if value="{{ interne }}" hint-placeholder-val="{{ true }}">
  <div class="rl-s">
    <span class="rl-i" data-active="{{ aHome }}" title="Accueil"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg></span>
    <span class="rl-i" data-active="{{ aSales }}" title="Ventes"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h7l11 11-7 7L3 10V3z"></path><circle cx="7" cy="7" r="1.4" fill="currentColor" stroke="none"></circle></svg></span>
    <span class="rl-i" data-active="{{ aService }}" title="Service Auto"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 3.5a5 5 0 0 0-6.3 6.3L3 15v6h6l5.2-5.2a5 5 0 0 0 6.3-6.3l-3.2 3.2-3-3 3.2-3.2z"></path></svg></span>
    <span class="rl-i" data-active="{{ aBuy }}" title="Achats"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5v-9z"></path><path d="M3 7.5 12 12l9-4.5M12 12v9"></path></svg></span>
    <span class="rl-i" data-active="{{ aCash }}" title="Cash Flow"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18v12H3z"></path><circle cx="12" cy="12" r="2.5"></circle></svg></span>
    <span class="rl-d"></span>
    <span class="rl-i" data-active="{{ aStock }}" data-open="{{ oStock }}" title="Stock"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="3.5"></circle></svg></span>
    <span class="rl-i" data-active="{{ aTiers }}" data-open="{{ oTiers }}" title="Tiers"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"></circle><path d="M3 20v-1.5c0-2.2 2.7-3.5 6-3.5s6 1.3 6 3.5V20"></path><path d="M16 5.5a3.2 3.2 0 0 1 0 6.2M18 20v-1.5c0-1.5-.9-2.6-2.3-3.2"></path></svg></span>
    <span class="rl-i" data-active="{{ aFin }}" data-open="{{ oFin }}" title="Finance"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 4l9 5.5"></path><path d="M5 9.5V19h14V9.5M9 19v-6M15 19v-6M3 21h18"></path></svg></span>
    <span class="rl-i" data-active="{{ aAdmin }}" data-open="{{ oAdmin }}" title="Administration"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8"></path></svg></span>
  </div>
  </sc-if>

  <sc-if value="{{ client }}" hint-placeholder-val="{{ false }}">
  <div class="rl-s">
    <span class="rl-i" data-active="{{ aCmd }}" title="Mes commandes"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5v-9z"></path><path d="M3 7.5 12 12l9-4.5M12 12v9"></path></svg></span>
    <span class="rl-i" title="Devis"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h10l4 4v14H5z"></path><path d="M9 12h6M9 16h4"></path></svg></span>
    <span class="rl-i" title="Factures"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3h16v18l-4-2-4 2-4-2-4 2z"></path><path d="M8 8h8M8 12h8"></path></svg></span>
    <span class="rl-i" title="Mon compte"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"></circle><path d="M5 20v-1.6c0-2.3 3.1-3.6 7-3.6s7 1.3 7 3.6V20"></path></svg></span>
  </div>
  </sc-if>

  <div class="rl-u"><span>{{ initials }}</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:64,&quot;height&quot;:760},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;sales&quot;,&quot;service&quot;,&quot;buy&quot;,&quot;cash&quot;,&quot;stock&quot;,&quot;tiers&quot;,&quot;fin&quot;,&quot;admin&quot;,&quot;cmd&quot;],&quot;default&quot;:&quot;sales&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;open&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;stock&quot;,&quot;tiers&quot;,&quot;fin&quot;,&quot;admin&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;interne&quot;,&quot;client&quot;],&quot;default&quot;:&quot;interne&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;initials&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;AB&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'sales';
    const o = this.props.open ?? '';
    const v = this.props.variant ?? 'interne';
    return {
      interne: v === 'interne',
      client: v === 'client',
      initials: this.props.initials ?? (v === 'client' ? 'TC' : 'AB'),
      aHome: a === 'home', aSales: a === 'sales', aService: a === 'service',
      aBuy: a === 'buy', aCash: a === 'cash', aStock: a === 'stock',
      aTiers: a === 'tiers', aFin: a === 'fin', aAdmin: a === 'admin',
      aCmd: a === 'cmd',
      oStock: o === 'stock', oTiers: o === 'tiers', oFin: o === 'fin', oAdmin: o === 'admin'
    };
  }
}
</script>
</body>
</html>
