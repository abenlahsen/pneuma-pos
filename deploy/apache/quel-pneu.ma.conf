# Apache virtual host for www.quel-pneu.ma
# For HestiaCP with Apache 2 — HTTP version (Certbot/Hestia will add SSL)
#
# IMPORTANT: when running certbot, use `--redirect` so HTTP is 301'd to HTTPS.
# Without that, auth tokens can leak over plaintext. See README.md §7.
#
# Required Apache modules:
#   a2enmod rewrite proxy_fcgi setenvif headers
#   a2enconf php8.4-fpm   (adjust version as needed)

<VirtualHost *:80>
    ServerName quel-pneu.ma
    ServerAlias www.quel-pneu.ma
    ServerAdmin admin@quel-pneu.ma

    # ──────────────────────────────────────────────
    # Document root → Laravel public directory
    # ──────────────────────────────────────────────
    DocumentRoot /var/www/quel-pneu.ma/back/public

    # ──────────────────────────────────────────────
    # Security headers
    # ──────────────────────────────────────────────
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    # HSTS — only honored by browsers when served over HTTPS. Safe to set on
    # the HTTP block because Certbot moves it to the 443 VirtualHost.
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # Max upload size (match PHP's upload_max_filesize)
    LimitRequestBody 20971520

    # ──────────────────────────────────────────────
    # PHP-FPM via proxy (adjust socket path if needed)
    # ──────────────────────────────────────────────
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php-fpm.sock|fcgi://localhost"
    </FilesMatch>

    # ──────────────────────────────────────────────
    # Laravel backend — /api and /sanctum
    # ──────────────────────────────────────────────
    <Directory /var/www/quel-pneu.ma/back/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # ──────────────────────────────────────────────
    # Angular SPA — all non-API routes
    # ──────────────────────────────────────────────
    Alias / /var/www/quel-pneu.ma/front-dist/

    <Directory /var/www/quel-pneu.ma/front-dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # SPA fallback: serve index.html for any route not matching a real file
        RewriteEngine On
        RewriteBase /
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.html [L]
    </Directory>

    # No-cache for index.html so new deploys are picked up immediately
    <Files "index.html">
        <If "%{REQUEST_URI} !~ m#^/api#">
            Header set Cache-Control "no-cache, no-store, must-revalidate"
            Header set Pragma "no-cache"
            Header set Expires "0"
        </If>
    </Files>

    # ──────────────────────────────────────────────
    # Route /api and /sanctum to Laravel (not Angular)
    # ──────────────────────────────────────────────
    AliasMatch "^/api(/.*)?$" "/var/www/quel-pneu.ma/back/public/index.php"
    AliasMatch "^/sanctum(/.*)?$" "/var/www/quel-pneu.ma/back/public/index.php"

    # ──────────────────────────────────────────────
    # Cache static assets (JS, CSS, fonts, images)
    # ──────────────────────────────────────────────
    <LocationMatch "\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    # ──────────────────────────────────────────────
    # Block access to hidden files (.git, .env, etc.)
    # ──────────────────────────────────────────────
    <DirectoryMatch "/\.">
        Require all denied
    </DirectoryMatch>

    # ──────────────────────────────────────────────
    # Logging
    # ──────────────────────────────────────────────
    ErrorLog ${APACHE_LOG_DIR}/quel-pneu.ma-error.log
    CustomLog ${APACHE_LOG_DIR}/quel-pneu.ma-access.log combined
</VirtualHost>
