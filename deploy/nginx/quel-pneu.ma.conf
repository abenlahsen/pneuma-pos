# Nginx virtual host for www.quel-pneu.ma
# This is the HTTP-only version — Certbot will add SSL automatically.
#
# IMPORTANT: when running certbot, use `--redirect` so HTTP is 301'd to HTTPS.
# Without that, auth tokens can leak over plaintext. See README.md §7.
#
# Security headers live in /etc/nginx/snippets/quel-pneu-security-headers.conf
# (source: deploy/nginx/security-headers.conf, installed by deploy.sh). The
# snippet is included once at server level and again in every location that
# sets its own add_header — nginx replaces, it does not merge.

server {
    listen 80;
    listen [::]:80;
    server_name quel-pneu.ma www.quel-pneu.ma;

    # Laravel backend root
    root /var/www/quel-pneu.ma/back/public;
    index index.php;

    include /etc/nginx/snippets/quel-pneu-security-headers.conf;

    # Max upload size (for file uploads in the app)
    client_max_body_size 20M;

    # --------------------------------------------------
    # API & Sanctum routes → Laravel (PHP-FPM)
    # --------------------------------------------------
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /sanctum {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP processing
    location ~ \.php$ {
        # Only hand real files to FPM: without this, /x.png/y.php would let
        # cgi.fix_pathinfo walk back to x.png and execute it.
        try_files $uri =404;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # --------------------------------------------------
    # Angular SPA → static files
    # --------------------------------------------------
    location / {
        # Serve Angular compiled files
        root /var/www/quel-pneu.ma/front-dist;
        try_files $uri $uri/ /index.html;

        # Never cache index.html so new deploys are picked up immediately
        location = /index.html {
            include /etc/nginx/snippets/quel-pneu-security-headers.conf;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }

    # Laravel public storage — ^~ stops nginx checking regex patterns so the
    # static-assets block below does not accidentally serve files from front-dist.
    location ^~ /storage/ {
        root /var/www/quel-pneu.ma/back/public;
        try_files $uri $uri/ =404;
        expires 30d;
        include /etc/nginx/snippets/quel-pneu-security-headers.conf;
        add_header Cache-Control "public";
        access_log off;

        # Uploads are data, never code — whatever their extension.
        location ~* \.(php|phtml|phar)$ {
            deny all;
        }
        location ~ /\. {
            deny all;
        }
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/quel-pneu.ma/front-dist;
        expires 1y;
        include /etc/nginx/snippets/quel-pneu-security-headers.conf;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Block access to hidden files
    location ~ /\. {
        deny all;
    }
}
