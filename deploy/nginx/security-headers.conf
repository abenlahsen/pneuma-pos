# En-tetes de securite — inclus dans le bloc `server` ET dans chaque `location`
# qui declare son propre `add_header`. Regle nginx : un `add_header` dans un
# location remplace la liste heritee au lieu de la completer ; sans cet
# include, /index.html, /storage/ et les assets partaient sans aucun en-tete
# (constat H5 de SECURITY_AUDIT.md).
#
# Installe par deploy.sh dans /etc/nginx/snippets/quel-pneu-security-headers.conf
# a chaque deploiement, independamment du vhost (que Certbot a pu modifier).

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# HSTS : ignore par le navigateur tant que la page vient en HTTP — sans effet
# sur le bloc 80, actif des que Certbot sert le 443.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# CSP. Ce que l'application charge reellement :
#   - styles inline generes par Angular (composants) -> 'unsafe-inline' sur style-src
#   - police Archivo depuis Google Fonts (front/src/styles.scss)
#   - apercus logo/favicon en blob: (URL.createObjectURL) et data:
#   - html2canvas (PDF) clone la page dans une iframe same-origin -> frame-src 'self'
# Aucun script externe, aucun eval : script-src reste 'self'.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
