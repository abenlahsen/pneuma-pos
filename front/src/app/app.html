@if (authService.isAuthenticated()) {
  <div class="app-shell">
    <app-topbar></app-topbar>
    <app-rail></app-rail>

    <main class="main-content">
      <div class="main-content__inner">
        <router-outlet />
      </div>
    </main>

    <!-- Montée ici et non dans la barre haute : elle doit rester atteignable
         au clavier (⌘K) depuis n'importe quel écran, et se superposer à tout. -->
    <app-command-palette />
  </div>
} @else {
  <router-outlet />
}
