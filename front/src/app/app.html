@if (authService.isAuthenticated()) {
  <div class="app-shell">
    <app-topbar></app-topbar>
    <app-rail></app-rail>

    <!-- Refonte 2b, 8a : n'apparaît que sous le seuil de changement de forme,
         là où le rail a cessé d'être une colonne. C'est app.scss qui décide. -->
    <app-bottom-bar></app-bottom-bar>

    <main class="main-content">
      <div class="main-content__inner">
        <router-outlet />
      </div>
    </main>

    <!-- Montée ici et non dans la barre haute : elle doit rester atteignable
         au clavier (⌘K) depuis n'importe quel écran, et se superposer à tout. -->
    <app-command-palette />

    <!-- Étape 14a : barre haute et bandeau « Toujours en cours… », pour toute
         requête qui dure. Fixés au viewport, au-dessus des volets. -->
    <app-pending-indicator />
  </div>
} @else {
  <router-outlet />
}
