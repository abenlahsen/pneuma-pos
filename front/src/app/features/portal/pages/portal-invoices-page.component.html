<div class="portal-topbar">
  <h1>Factures</h1>
  <div class="portal-topbar__right">
    <span class="portal-topbar__account">Transport Chaouia · Compte 1042</span>
  </div>
</div>

<table class="portal-table">
  <thead>
    <tr>
      <th>Facture</th>
      <th>Date</th>
      <th class="num">Montant</th>
      <th>Statut</th>
      <th>Document</th>
    </tr>
  </thead>
  <tbody>
    @for (invoice of invoices; track invoice.reference) {
      <tr>
        <td class="strong">{{ invoice.reference }}</td>
        <td class="num">{{ invoice.date }}</td>
        <td class="num">{{ invoice.amount }}</td>
        <td>
          <span class="portal-badge" [class.portal-badge--due]="invoice.status === 'En attente'">
            {{ invoice.status }}
          </span>
        </td>
        <td><a href="#" class="portal-doc-link" (click)="$event.preventDefault()">Facture PDF</a></td>
      </tr>
    }
  </tbody>
</table>
