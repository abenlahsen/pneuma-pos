<!-- Refonte 2b, 9a : les boutons vivent dans le pied de la coque de volet
     (voir sale-detail). Le `form` les y relie par son identifiant. -->
<form (ngSubmit)="onSubmit()" #form="ngForm" id="shipment-change-form" class="form-container">
  <div class="form-section">
    <h3 class="section-title">Expédition</h3>
    <div class="form-grid">
      <div class="form-control">
        <label>Transporteur</label>
        <select name="carrier_id" [ngModel]="carrierId()" (ngModelChange)="carrierId.set($event)">
          <option [ngValue]="null">— Sélectionner —</option>
          <option *ngFor="let c of carriers()" [ngValue]="c.id">{{ c.name }}</option>
        </select>
      </div>
      <div class="form-control">
        <label>N° d'expédition</label>
        <input type="text" name="shipment_number" [ngModel]="shipmentNumber()" (ngModelChange)="shipmentNumber.set($event)" placeholder="Numéro de suivi">
      </div>
      <div class="form-control">
        <label>Date de la demande *</label>
        <input type="date" name="date" [ngModel]="date()" (ngModelChange)="date.set($event)" required>
      </div>
      <div class="form-control full-width">
        <label>Motif</label>
        <textarea name="reason" rows="2" [ngModel]="reason()" (ngModelChange)="reason.set($event)" placeholder="Raison de la demande de modification"></textarea>
      </div>
    </div>
  </div>

  <div class="form-section">
    <div class="section-title-row">
      <h3 class="section-title">Modifications demandées</h3>
      <button type="button" class="btn btn-secondary btn-sm add-item-btn" (click)="addItem()">+ Ajouter une modification</button>
    </div>

    <!-- Refonte 2b : le tableau de quatre colonnes ne tenait pas dans les
         480 px du volet. Chaque modification devient une fiche de trois
         rangées — l'élément, l'ancienne valeur, la nouvelle — avec la même
         lecture barré → gras que la lettre envoyée au transporteur. -->
    <div class="sc-items" *ngIf="items().length; else noItems">
      <div class="sc-item" *ngFor="let item of items(); let i = index">

        <div class="sc-head">
          <select class="sc-field" [ngModel]="item.field" [ngModelOptions]="{standalone: true}"
                  (ngModelChange)="onFieldChange(i, $event)">
            <!-- Un champ pris par une autre ligne est grisé : une demande ne
                 modifie pas deux fois le même élément. `other` fait exception. -->
            <option *ngFor="let opt of fieldOptions" [ngValue]="opt.value"
                    [disabled]="isFieldTaken(opt.value, i)">{{ opt.label }}</option>
          </select>
          <button type="button" class="sc-drop" (click)="removeItem(i)" title="Retirer cette modification">
            <app-icon name="close" [size]="14" />
          </button>
        </div>

        <input *ngIf="item.field === 'other'" type="text" class="sc-custom"
               placeholder="Libellé de l'élément" [ngModel]="item.custom_label"
               [ngModelOptions]="{standalone: true}" (ngModelChange)="item.custom_label = $event">

        <label class="sc-row">
          <span class="sc-label">Valeur actuelle</span>
          <!-- Verrouillée quand elle vient du préremplissage — c'est un constat
               tiré de la vente, barré et grisé comme sur la lettre. Saisissable
               quand personne ne peut la deviner : ligne « Autre », ou source
               vide côté client. -->
          <input type="text" class="sc-old"
                 [class.sc-old--locked]="isOldValueLocked(item)"
                 [readonly]="isOldValueLocked(item)"
                 [attr.tabindex]="isOldValueLocked(item) ? -1 : null"
                 [ngModel]="item.old_value" [ngModelOptions]="{standalone: true}"
                 (ngModelChange)="setOldValue(i, $event)"
                 [placeholder]="isOldValueLocked(item) ? '' : 'À renseigner — rien de connu côté vente'">
        </label>

        <span class="sc-arrow" aria-hidden="true">
          <app-icon name="chevron-down" [size]="15" />
        </span>

        <label class="sc-row">
          <span class="sc-label">Nouvelle valeur *</span>
          <input type="text" class="sc-new" [ngModel]="item.new_value"
                 [ngModelOptions]="{standalone: true}" (ngModelChange)="item.new_value = $event"
                 placeholder="Ce qu'il faut mettre à la place" required>
        </label>

      </div>
    </div>
    <ng-template #noItems>
      <div class="empty-state small">Aucune modification ajoutée.</div>
    </ng-template>
  </div>

</form>
