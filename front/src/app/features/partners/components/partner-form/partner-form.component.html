<!-- Refonte 2b, 9a : la modale écrite en ligne dans partners-page passe par la
     coque 15b. Sept champs, sous le seuil de dix du §5b, rangés en deux
     colonnes pour que la boîte ne défile pas — ce que le gabarit interdit. -->
<app-referential-modal
  referential="partenaire"
  [title]="partner ? 'Modifier ' + partner.name : 'Nouveau partenaire'"
  (dismiss)="cancel.emit()">

  <form (ngSubmit)="onSubmit()" #form="ngForm" class="pf-grid" id="partenaire-form">
    <label class="rf-field pf-field--wide">
      <span>Nom du partenaire *</span>
      <input type="text" name="name" [(ngModel)]="formData.name" required placeholder="Ex: Garage Atlas">
    </label>

    <label class="rf-field">
      <span>Ville</span>
      <select name="city" [(ngModel)]="formData.city">
        <option value="">— Sélectionner —</option>
        <option *ngFor="let c of cities" [value]="c">{{ c }}</option>
      </select>
    </label>

    <label class="rf-field">
      <span>Téléphone</span>
      <input type="text" name="phone" [(ngModel)]="formData.phone" placeholder="Numéro fixe">
    </label>

    <label class="rf-field">
      <span>Mobile</span>
      <input type="text" name="mobile" [(ngModel)]="formData.mobile" placeholder="Numéro mobile">
    </label>

    <label class="rf-field pf-field--wide">
      <span>Adresse</span>
      <input type="text" name="address" [(ngModel)]="formData.address" placeholder="Adresse complète">
    </label>

    <span class="pf-section pf-field--wide">Tarification des services</span>

    <label class="rf-field">
      <span>Montage + équilibrage (DH/pneu)</span>
      <input type="number" name="montage_price" [(ngModel)]="formData.montage_price" step="0.01" min="0" placeholder="Ex: 50.00">
    </label>

    <label class="rf-field">
      <span>Parallélisme (DH)</span>
      <input type="number" name="alignment_price" [(ngModel)]="formData.alignment_price" step="0.01" min="0" placeholder="Ex: 150.00">
    </label>
  </form>

  <ng-container actions>
    <button type="button" class="rf-btn" (click)="cancel.emit()">Annuler</button>
    <button type="submit" form="partenaire-form" class="rf-btn rf-btn--solid" [disabled]="!form.valid">
      {{ partner ? 'Mettre à jour' : 'Créer le partenaire' }}
    </button>
  </ng-container>
</app-referential-modal>
