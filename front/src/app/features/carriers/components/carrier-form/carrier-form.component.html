<!-- Refonte 2b, gabarit 15b : coque de modale partagée. Le formulaire
     porte lui-même sa coque, comme product-form porte la sienne. -->
<app-referential-modal
  referential="transporteur"
  [title]="carrier ? 'Modifier ' + carrier.name : 'Nouveau transporteur'"
  [linked]="linkedCount"
  [linkedLabel]="linkedLabel"
  (dismiss)="cancel.emit()">

  <form (ngSubmit)="onSubmit()" #form="ngForm" class="rf-form" id="transporteur-form">
    <label class="rf-field">
      <span>Nom de la société *</span>
      <input type="text" name="name" [(ngModel)]="formData.name" required placeholder="Ex: SDTM, M.T.R, GHAZALA...">
    </label>

    <label class="rf-field">
      <span>Téléphone</span>
      <input type="text" name="phone" [(ngModel)]="formData.phone" placeholder="Numéro de téléphone">
    </label>

    <label class="rf-field">
      <span>Email</span>
      <input type="email" name="email" [(ngModel)]="formData.email" placeholder="Adresse email">
    </label>
  </form>

  <ng-container actions>
    <button type="button" class="rf-btn" (click)="cancel.emit()">Annuler</button>
    <button type="submit" form="transporteur-form" class="rf-btn rf-btn--solid" [disabled]="!form.valid">Enregistrer</button>
  </ng-container>
</app-referential-modal>
