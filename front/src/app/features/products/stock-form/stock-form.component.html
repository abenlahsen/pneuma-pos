<form (ngSubmit)="onSubmit()" #form="ngForm" class="form-container">

  <div class="form-section">
    <h3>Produit</h3>
    <div class="form-grid">
      <div class="form-control full-width">
        <label>Rechercher un produit</label>
        <input
          type="text"
          [ngModel]="productSearch()"
          (ngModelChange)="productSearch.set($event)"
          (input)="searchProducts()"
          name="productSearch"
          placeholder="Rechercher par marque, dimension, profil..."
          autocomplete="off"
        >
      </div>

      <div class="form-control full-width">
        <label>Produit *</label>
        <select
          name="product_id"
          [ngModel]="formData.product_id"
          (change)="onProductSelected($event)"
          required
        >
          <option [value]="0" disabled>-- Sélectionner un produit --</option>
          <option *ngFor="let p of products()" [value]="p.id">
            {{ formatProductLabel(p) }}
          </option>
        </select>
        <span class="hint" *ngIf="loadingProducts()">Chargement...</span>
      </div>
    </div>
  </div>

  <div class="form-section">
    <h3>Origine & Stockage</h3>
    <div class="form-grid">
      <div class="form-control">
        <label>Origine (Made In)</label>
        <input type="text" name="made_in" [(ngModel)]="formData.made_in" placeholder="Ex: FRANCE">
      </div>

      <div class="form-control">
        <label>DOT</label>
        <input type="text" name="dot" [(ngModel)]="formData.dot" placeholder="Ex: 2024">
      </div>

      <div class="form-control">
        <label>Dépôt</label>
        <input type="text" name="depot" [(ngModel)]="formData.depot" placeholder="Ex: Depot1">
      </div>

      <div class="form-control">
        <label>Zone</label>
        <input type="text" name="zone" [(ngModel)]="formData.zone" placeholder="Ex: A1">
      </div>
    </div>
  </div>

  <div class="form-section">
    <h3>Quantité & Prix</h3>
    <div class="form-grid">
      <div class="form-control">
        <label>Quantité *</label>
        <input
          type="number"
          name="quantity"
          [ngModel]="formData.quantity"
          (ngModelChange)="onQuantityChange($event)"
          required
          min="0"
        >
      </div>

      <div class="form-control">
        <label>Prix d'achat (DH)</label>
        <input type="number" name="purchase_price" [(ngModel)]="formData.purchase_price" min="0" step="0.01" placeholder="0.00">
      </div>
    </div>
  </div>

  <div class="form-section" *ngIf="reasonRequired()">
    <h3>Motif de l'ajustement</h3>
    <div class="form-grid">
      <div class="form-control full-width">
        <label>Motif * <span class="hint">(requis car la quantité a changé)</span></label>
        <textarea
          name="reason"
          [ngModel]="reason()"
          (ngModelChange)="reason.set($event)"
          rows="3"
          minlength="3"
          maxlength="1000"
          required
          placeholder="Ex: Inventaire physique, casse, correction d'erreur..."
        ></textarea>
      </div>
    </div>
  </div>

  <div class="form-actions">
    <button type="button" class="btn btn-secondary" (click)="cancel.emit()">Annuler</button>
    <button
      type="submit"
      class="btn btn-primary"
      [disabled]="!form.valid || formData.product_id === 0 || (reasonRequired() && reason().trim().length < 3)"
    >Enregistrer</button>
  </div>
</form>
