<!-- Refonte 2b, 9a : la modale écrite à la main passe par la coque 15b.
     Cinq champs, largement sous le seuil de dix du §5b. -->
<app-referential-modal
  referential="transfert"
  [title]="'Transfert entre comptes'"
  (dismiss)="onCancel()">

  <form [formGroup]="form" (ngSubmit)="onSubmit()" id="transfer-form">
      <div class="form-row">
        <div class="form-group">
          <label for="tf-source">De (Compte source) *</label>
          <select id="tf-source" formControlName="source_account_id">
            <option value="">-- Sélectionner --</option>
            @for (acc of activeAccounts; track acc.id) {
              <option [value]="acc.id">{{ acc.name }} ({{ acc.current_balance }} DH)</option>
            }
          </select>
        </div>
        <div class="form-group">
          <label for="tf-dest">Vers (Compte destination) *</label>
          <select id="tf-dest" formControlName="destination_account_id">
            <option value="">-- Sélectionner --</option>
            @for (acc of activeAccounts; track acc.id) {
              <option [value]="acc.id">{{ acc.name }} ({{ acc.current_balance }} DH)</option>
            }
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="tf-amount">Montant (DH) *</label>
          <input type="number" id="tf-amount" formControlName="amount" step="0.01" min="0.01" />
        </div>
        <div class="form-group">
          <label for="tf-date">Date *</label>
          <input type="date" id="tf-date" formControlName="date" />
        </div>
      </div>

      <div class="form-group">
        <label for="tf-desc">Description</label>
        <textarea id="tf-desc" formControlName="description" rows="2" placeholder="Ex: Transfert de caisse vers banque..."></textarea>
      </div>

  </form>

  <ng-container actions>
    <button type="button" (click)="onCancel()" class="rf-btn">Annuler</button>
    <button type="submit" form="transfer-form" [disabled]="form.invalid" class="rf-btn rf-btn--solid">
      {{ 'Transférer' }}
    </button>
  </ng-container>
</app-referential-modal>
