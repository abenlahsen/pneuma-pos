<!-- Refonte 2b, 9a : la modale écrite à la main passe par la coque 15b.
     Cinq champs, largement sous le seuil de dix du §5b. -->
<app-referential-modal
  referential="compte"
  [title]="isEdit() ? 'Modifier le compte' : 'Nouveau compte'"
  (dismiss)="onCancel()">

  <form [formGroup]="form" (ngSubmit)="onSubmit()" id="account-form">
      <div class="form-row">
        <div class="form-group">
          <label for="acc-name">Nom du compte *</label>
          <input type="text" id="acc-name" formControlName="name" placeholder="ex: Caisse principale" />
        </div>
        <div class="form-group">
          <label for="acc-type">Type *</label>
          <select id="acc-type" formControlName="type">
            <option value="cash"><app-icon name="banknote" [size]="14" /> Caisse</option>
            <option value="bank"><app-icon name="banknote" [size]="14" /> Banque</option>
            <option value="person"><app-icon name="user" [size]="14" /> Personne</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="acc-balance">Solde initial (DH) *</label>
          <input type="number" id="acc-balance" formControlName="initial_balance" step="0.01" />
          <small class="text-muted">Le solde actuel = solde initial + transactions.</small>
        </div>
        <div class="form-group" style="display: flex; align-items: center; margin-top: 1.5rem;">
          <label class="checkbox-label" style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
            <input type="checkbox" formControlName="is_active" style="width: auto; height: auto;" />
            Compte actif
          </label>
        </div>
      </div>

      <div class="form-group">
        <label for="acc-desc">Description</label>
        <textarea id="acc-desc" formControlName="description" rows="2" placeholder="Notes..."></textarea>
      </div>

  </form>

  <ng-container actions>
    <button type="button" (click)="onCancel()" class="rf-btn">Annuler</button>
    <button type="submit" form="account-form" [disabled]="form.invalid" class="rf-btn rf-btn--solid">
      {{ isEdit() ? 'Mettre à jour' : 'Ajouter' }}
    </button>
  </ng-container>
</app-referential-modal>
