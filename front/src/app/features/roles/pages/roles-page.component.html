<div class="page-container">
  <div class="header">
    <div class="title-section">
      <h1>Gestion des Rôles</h1>
      <p class="subtitle">Gérez les rôles et leurs permissions d'accès</p>
    </div>
    <div class="actions">
      <button class="btn btn-secondary" (click)="openPermissionForm()" *ngIf="authService.hasPermission('create roles')">
        Nouvelle Permission
      </button>
      <button class="btn btn-primary" (click)="openAddForm()" *ngIf="authService.hasPermission('create roles')">
        Nouveau Rôle
      </button>
      <app-auto-refresh-control pageKey="roles" (refresh)="loadData()" />
    </div>
  </div>

  <!-- Refonte 2b, étape 11 : motif de ligne, à la place du <table>. Pas de
       barre de filtres : l'écran n'a jamais eu de filtre, les rôles tiennent
       en une poignée de lignes. -->
  <div class="card table-card">
    <div class="list-grid-header roles-grid">
      <span>Rôle</span>
      <span class="list-cell--drop">Modules couverts</span>
      <span class="text-right">Actions</span>
    </div>

    <!-- Refonte 2b, §14c : chargement, erreur, liste vide — dans cet ordre. -->
    <app-list-error
      *ngIf="loadError()"
      title="Les rôles n'ont pas pu être chargés."
      [cause]="loadError()!"
      [detail]="loadErrorDetail()"
      [lastLoadedAt]="lastLoadedAt()"
      (retry)="loadData()" />

    <!-- `*ngIf` et non `[hidden]` : `.list-grid-row` pose `display: grid`, qui
         l'emporte sur le `display: none` de l'attribut. -->
    <ng-container *ngIf="loading() && roles().length === 0">
      <div class="list-grid-row roles-grid" appSkeletonRow [cells]="3" [seed]="i"
           *ngFor="let row of skeletonRows; let i = index"></div>
    </ng-container>

    <app-list-empty
      *ngIf="!loading() && !loadError() && roles().length === 0"
      blankTitle="Aucun rôle enregistré pour le moment." />

    <div class="list-grid-row roles-grid" *ngFor="let role of roles()">
      <span class="list-cell--identity">
        <!-- Le nom ouvre le formulaire : un lien, jamais un bouton. Le rôle
             système n'a pas de formulaire à ouvrir. -->
        <span class="list-grid-name">
          <a href="" *ngIf="canEditRole(role)" (click)="$event.preventDefault(); openEditForm(role)">{{ role.name }}</a>
          <ng-container *ngIf="!canEditRole(role)">{{ role.name }}</ng-container>
          <span class="list-grid-tag" *ngIf="isSystemRole(role)">SYSTÈME</span>
        </span>
        <span class="list-grid-sub">{{ permissionCountLabel(role) }}</span>
      </span>

      <span class="list-cell--drop roles-modules">{{ roleModules(role) || '—' }}</span>

      <span class="actions-cell list-cell--actions">
        <!-- Refonte 2b, §14c état 4 : le rôle système garde la place des deux
             boutons sous un seul cadenas, et l'infobulle dit pourquoi. -->
        <app-row-lock *ngIf="isSystemRole(role)"
          reason="Rôle système : l'application lui attribue toutes les permissions, il ne se modifie ni ne se supprime." />
        <ng-container *ngIf="!isSystemRole(role)">
          <button class="btn-icon" (click)="openEditForm(role)" title="Modifier" *ngIf="authService.hasPermission('edit roles')"><app-icon name="edit" [size]="15" /></button>
          <app-row-lock *ngIf="!authService.hasPermission('edit roles')"
            reason="Votre rôle ne permet pas de modifier un rôle. Demandez à un administrateur." />
          <button class="btn-icon text-danger" (click)="deleteRole(role)" title="Supprimer" *ngIf="authService.hasPermission('delete roles')"><app-icon name="trash" [size]="15" /></button>
          <app-row-lock *ngIf="!authService.hasPermission('delete roles')"
            reason="Votre rôle ne permet pas de supprimer un rôle. Demandez à un administrateur." />
        </ng-container>
      </span>
    </div>
  </div>

  <div class="card permissions-card">
    <div class="card-header">
      <h2>Permissions</h2>
    </div>
    <div class="card-body">
      <div class="permissions-grid">
        <div class="permission-group" *ngFor="let entry of groupedPermissions() | keyvalue">
          <h3 class="group-title">{{ getResourceLabel(entry.key) }}</h3>
          <div class="group-perms">
            <div class="perm-item" *ngFor="let perm of entry.value">
              <span class="perm-name">{{ perm.name }}</span>
              <button class="btn-icon btn-xs text-danger" (click)="deletePermission(perm)" title="Supprimer" *ngIf="authService.hasPermission('delete roles')"><app-icon name="trash" [size]="14" /></button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Refonte 2b, étape 5b : les deux formulaires écrits en ligne sont extraits.
     Le rôle prend le gabarit 15a (83 permissions ne tiennent pas dans 480 px) ;
     la permission, à champ unique, prend la coque 15b. -->
<app-role-form
  *ngIf="showForm()"
  [role]="editingRole()"
  [grouped]="groupedPermissions()"
  [resourceLabel]="getResourceLabel"
  [actionLabel]="getActionLabel"
  (save)="saveRoleFrom($event)"
  (cancel)="closeForm()" />

<app-permission-form
  *ngIf="showPermissionForm()"
  [roleCount]="roles().length"
  (save)="addPermissionNamed($event)"
  (cancel)="closePermissionForm()" />
<!-- Refonte 2b, gabarit 15c : la confirmation remplace le confirm() natif. -->
<app-confirm-delete
  *ngIf="pendingDelete() as pending"
  [title]="pending.title"
  [consequence]="pending.consequence ?? ''"
  [detail]="pending.detail ?? ''"
  [confirmLabel]="pending.confirmLabel ?? 'Supprimer'"
  [reasonRequired]="pending.reasonRequired ?? false"
  (confirm)="runPendingDelete($event)"
  (cancel)="pendingDelete.set(null)" />
