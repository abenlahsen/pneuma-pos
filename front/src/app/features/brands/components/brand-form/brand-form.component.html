<!-- Refonte 2b, gabarit 15b : coque de modale partagée. Le formulaire
     porte lui-même sa coque, comme product-form porte la sienne. -->
<app-referential-modal
  referential="marque"
  [title]="brand ? 'Modifier ' + brand.name : 'Nouvelle marque'"
  [linked]="linkedCount"
  [linkedLabel]="linkedLabel"
  (dismiss)="cancel.emit()">

  <form (ngSubmit)="onSubmit()" #form="ngForm" class="rf-form" id="marque-form">
    <label class="rf-field">
      <span>Nom *</span>
      <input type="text" name="name" [(ngModel)]="formData.name" required placeholder="Ex: MICHELIN">
    </label>

    <label class="rf-field">
      <span>Logo</span>
      <input type="file" accept="image/*" (change)="onFileChange($event)">
      <img *ngIf="logoPreview" [src]="logoPreview" alt="Aperçu" class="rf-logo">
      <em class="rf-hint">PNG ou SVG · fond transparent · 200 px min.</em>
    </label>

    <label class="rf-check">
      <input type="checkbox" name="is_active" [(ngModel)]="formData.is_active">
      Actif — proposé à la saisie de vente et d'achat
    </label>
  </form>

  <ng-container actions>
    <button type="button" class="rf-btn" (click)="cancel.emit()">Annuler</button>
    <button type="submit" form="marque-form" class="rf-btn rf-btn--solid" [disabled]="!form.valid">Enregistrer</button>
  </ng-container>
</app-referential-modal>
