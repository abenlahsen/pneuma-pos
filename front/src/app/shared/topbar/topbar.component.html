<header class="topbar">
  <img [src]="brandLogoUrl()" (error)="onLogoError()" alt="PNEU.MA" class="topbar-logo">

  <!-- Un bouton, pas un champ : la saisie se fait dans la palette, qui doit
       s'ouvrir de la même façon depuis ici et depuis le raccourci clavier. -->
  <button type="button" class="topbar-search" (click)="openSearch()">
    <app-icon name="search" [size]="16" />
    <span class="topbar-search-label">Client, plaque, dimension (2055516), n° de vente…</span>
    <span class="topbar-search-hint">{{ shortcutLabel }}</span>
  </button>

  <span class="topbar-clock">{{ now() | date:'EEE d MMM · HH:mm' }}</span>

  <div class="topbar-user">
    <button type="button" class="topbar-avatar" (click)="toggleUserMenu()">{{ userInitial() }}</button>

    <div class="topbar-user-menu" *ngIf="userMenuOpen()">
      <div class="topbar-user-info">
        <span class="topbar-user-name">{{ userName() }}</span>
        <span class="topbar-user-role" *ngIf="userRole()">{{ userRole() }}</span>
      </div>
      <button type="button" class="topbar-logout" (click)="logout()">
        <app-icon name="log-out" [size]="14" /> Déconnexion
      </button>
    </div>
  </div>
</header>
