<nav class="navbar">
  <div class="navbar-brand">
    <a routerLink="/dashboard" class="brand-link" (click)="closeMenu()"><img src="logo.png" alt="PNEU.MA" class="brand-logo"></a>
    <button class="menu-toggle" (click)="toggleMenu()" [class.active]="menuOpen">
      <span></span><span></span><span></span>
    </button>
  </div>

  <div class="navbar-links" [class.open]="menuOpen">
    <a *ngFor="let item of visibleNavItems()"
       [routerLink]="item.route"
       routerLinkActive="active"
       [routerLinkActiveOptions]="{exact: !!item.exact}"
       (click)="closeMenu()">{{ item.label }}</a>
  </div>

  <div class="navbar-user">
    <span class="user-info" *ngIf="userName()">
      <span class="user-name">{{ userName() }}</span>
      <span class="user-role" *ngIf="userRole()">{{ userRole() }}</span>
    </span>
    <button class="btn-logout" (click)="logout()">Déconnexion</button>
  </div>
</nav>
