<nav class="navbar" [class.navbar--vertical]="menuLayout() === 'vertical'">
  <div class="navbar-brand">
    <a routerLink="/dashboard" class="brand-link" (click)="closeMenu()">
      <img [src]="brandLogoUrl()" [alt]="companySettings()?.company_name || 'PNEU.MA'" class="brand-logo">
    </a>
    <button
      *ngIf="menuLayout() !== 'vertical'"
      class="menu-toggle"
      (click)="toggleMenu()"
      [class.active]="menuOpen"
    >
      <span></span><span></span><span></span>
    </button>
  </div>

  <div class="navbar-links" [class.open]="menuOpen || menuLayout() === 'vertical'">
    <ng-container *ngFor="let item of visibleNavItems()">
      
      <a *ngIf="!item.children"
         [routerLink]="item.route"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{exact: !!item.exact}"
         (click)="closeMenu()">{{ item.label }}</a>

      <div class="nav-dropdown" [class.expanded]="isGroupExpanded(item)" *ngIf="item.children && item.children.length > 0">
        <button class="dropdown-toggle" (click)="toggleGroup(item, $event)">
          {{ item.label }} <span class="chevron">▾</span>
        </button>
        <div class="dropdown-menu">
          <a *ngFor="let child of item.children"
             [routerLink]="child.route"
             routerLinkActive="active"
             (click)="closeMenu()">{{ child.label }}</a>
        </div>
      </div>
      
    </ng-container>
  </div>

  <div class="navbar-user" [class.navbar-user--vertical]="menuLayout() === 'vertical'">
    <div class="user-avatar" *ngIf="userName()" [title]="userName()">{{ userName().charAt(0).toUpperCase() }}</div>
    <span class="user-info" *ngIf="userName()">
      <span class="user-name">{{ userName() }}</span>
      <span class="user-role" *ngIf="userRole()">{{ userRole() }}</span>
    </span>
    <button class="btn-logout" (click)="logout()">Déconnexion</button>
  </div>
</nav>
